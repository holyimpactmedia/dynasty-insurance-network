<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 198 42" width="198" height="42" role="img" aria-label="Union Private Healthcare">
  <title>Union Private Healthcare</title>
  <!-- Full lockup for LIGHT backgrounds. Mirrors <UnionLogo> in
       components/union/brand.tsx (size = 42).
       The mark is pure paths. The wordmark is live text in Space Grotesk with a
       fallback stack, so it renders correctly anywhere that font is available
       (the site, any machine with it installed). For print or a context where
       the font may be missing, use the PNG export instead. -->
  <defs>
    <clipPath id="unionTileL">
      <rect width="42" height="42" rx="11" ry="11"/>
    </clipPath>
  </defs>

  <rect width="42" height="42" rx="11" ry="11" fill="#0a2540"/>
  <g clip-path="url(#unionTileL)" fill="#d2232a" opacity="0.9">
    <rect x="0" y="0" width="42" height="5.5"/>
    <rect x="0" y="11" width="42" height="5.5"/>
    <rect x="0" y="22" width="42" height="5.5"/>
    <rect x="0" y="33" width="42" height="5.5"/>
  </g>
  <g transform="translate(10.5 10.5) scale(0.875)">
    <path d="M12 2.6l2.6 6.1 6.6.5-5 4.3 1.6 6.5L12 16.9 6.2 20l1.6-6.5-5-4.3 6.6-.5z" fill="#ffffff"/>
  </g>

  <text x="53" y="21.2"
        font-family="'Space Grotesk', 'Space Grotesk Fallback', system-ui, -apple-system, sans-serif"
        font-size="20.16" font-weight="700" letter-spacing="-0.5" fill="#0a2540">Union</text>
  <text x="53" y="34.5"
        font-family="'Space Grotesk', 'Space Grotesk Fallback', system-ui, -apple-system, sans-serif"
        font-size="8.82" font-weight="700" letter-spacing="2.3" fill="#6b7a8d">PRIVATE HEALTHCARE</text>
</svg>
